[build-system]
requires = ["setuptools>=80.3.1", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

[project]
name = "psycopg-yugabytedb"
description = "YugabyteDB smart-driver fork of psycopg 3 — adds cluster-aware and topology-aware load balancing"

# STOP AND READ! if you change:
version = "3.3.4.1.preview1"
# also change:
# - `psycopg_c/pyproject.toml` to the same version;
# - `psycopg_binary/pyproject.toml` to the same version;
# - the `c ` and `binary` "optional-dependencies" below to the same version.
#
# Version scheme: <upstream-psycopg-version>.N.previewM for EA, <upstream>.N for GA.

license = "LGPL-3.0-only"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">= 3.10"
dependencies = [
    "typing-extensions >= 4.6; python_version < '3.13'",
    "tzdata; sys_platform == 'win32'",
]

[[project.authors]]
name = "Daniele Varrazzo"
email = "daniele.varrazzo@gmail.com"

[[project.authors]]
name = "Yugabyte"
email = "support@yugabyte.com"

[project.urls]
Homepage = "https://www.yugabyte.com/"
Documentation = "https://docs.yugabyte.com/preview/drivers-orms/python/"
"Upstream psycopg" = "https://psycopg.org/"
Code = "https://github.com/yugabyte/psycopg-yugabytedb"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.optional-dependencies]
c = [
    "psycopg-yugabytedb-c == 3.3.4.1.preview1; implementation_name != \"pypy\"",
]
binary = [
    "psycopg-yugabytedb-binary == 3.3.4.1.preview1; implementation_name != \"pypy\"",
]
pool = [
    "psycopg-pool",
]
test = [
    "anyio >= 4.0",
    # Mypy >= 1.19 depends on librt, not available for PyPy.
    "mypy >= 1.19.0; implementation_name != \"pypy\"",
    "pproxy >= 2.7",
    "pytest >= 6.2.5",
    "pytest-cov >= 3.0",
    "pytest-randomly >= 3.5",
]
dev = [
    "ast-comments >= 1.1.2",
    "black >= 26.1.0",
    "codespell >= 2.2",
    "cython-lint >= 0.16",
    "dnspython >= 2.1",
    "flake8 >= 4.0",
    "isort[colors] >= 6.0",
    "isort-psycopg",
    "mypy >= 1.19.0",
    "pre-commit >= 4.0.1",
    "types-setuptools >= 57.4",
    "types-shapely >= 2.0",
    "wheel >= 0.37",
]
docs = [
    "Sphinx >= 9.1",
    "furo == 2025.12.19",
    "sphinx-autobuild >= 2025.8.25",
    "sphinx-autodoc-typehints >= 3.10.2",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
psycopg = [
    "py.typed",
]

[tool.setuptools.packages.find]
namespaces = false
